; Security Options ============================================================
;
; Twits have read-only access, and aren't allowed to post to the wall.
; List each twit here, separated with a semicolon (;)
twits = 

; This is the minimum security level allowed to post to the wall.
minSecurityLevel = 20


; Display Options =============================================================
;
; This is the number of posts to display
numberToDisplay = 14

; This is the row number of the first post
rowStart = 8

; This is the maximum disaplyable string length to post
maxPostLength = 60

; These are pipe color codes for the user names.
; Changing only affects new posts going forward; not existing posts.
aliasColor = |03
sysopColor = |11

; This is the default string to display if there are no posts.
blankWallString = The wall is empty! Add something!
